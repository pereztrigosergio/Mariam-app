<html lang="es">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#FFFFFF;color:#007AFF}
#app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;position:relative}
#hdr{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;flex-shrink:0}
#cnt{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 14px 86px;-webkit-overflow-scrolling:touch}
#tb{display:none;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid rgba(0,122,255,0.08);padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 6px);z-index:100}
.tb-inner{display:flex;justify-content:space-around}
.tbb{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:4px 10px;color:#A8B3C2;font-size:10px;font-family:-apple-system,sans-serif}
.tbb.on{color:#007AFF}
.tbb svg{width:20px;height:20px;stroke-width:1.8}
.card{background:#fff;border-radius:16px;border:1px solid #EEF1F5;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,122,255,0.04)}
.slbl{font-size:10px;font-weight:700;color:#8A94A6;text-transform:uppercase;letter-spacing:.08em;padding:14px 2px 7px}
.exc{background:#fff;border-radius:14px;border:1.5px solid #007AFF;padding:11px 12px;margin-bottom:8px;display:flex;gap:10px;cursor:pointer;transition:all .15s;box-shadow:0 1px 3px rgba(0,122,255,0.05)}
.exc:active{opacity:.7}
.exc.ok{border-color:#34C77A;background:#F3FBF6;box-shadow:none}
.xn{font-size:13px;font-weight:600;flex:1;line-height:1.3;color:#007AFF}
.xn.ok{color:#1F8A52}
.xr{font-size:11px;font-weight:700;white-space:nowrap;color:#007AFF}
.xt{font-size:10px;padding:2px 7px;border-radius:20px;margin-right:4px;margin-top:4px;display:inline-block;background:#EAF2FE;color:#007AFF;border:none}
.xd{font-size:11px;color:#5C6B7F;margin-top:5px;line-height:1.55;display:none;border-top:1px solid #EEF1F5;padding-top:6px}
.xd.show{display:block}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid #C9D3E0;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;font-size:11px;color:transparent;transition:all .2s}
.chk.ok{background:#34C77A;border-color:#34C77A;color:#fff}
.pb{height:4px;background:#EEF1F5;border-radius:99px;overflow:hidden;margin-top:8px}
.pf{height:100%;border-radius:99px;transition:width .4s;background:#007AFF}
.btn{width:100%;padding:12px;border-radius:14px;border:1px solid #EEF1F5;background:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:-apple-system,sans-serif;margin-bottom:7px;color:#007AFF;text-align:center}
.btn:active{opacity:.7}
.btn-blue{background:#007AFF;color:#fff;border-color:#007AFF;box-shadow:0 4px 10px rgba(0,122,255,.25)}
.btn-orange{background:#007AFF;color:#fff;border-color:#007AFF}
.btn-green{background:#F3FBF6;color:#1F8A52;border-color:#BEE9CE}
.btn-red{color:#007AFF;border-color:rgba(0,122,255,0.2)}
.mob-item{background:#fff;border-radius:14px;border:1.5px solid #007AFF;padding:11px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .15s;box-shadow:0 1px 3px rgba(0,122,255,0.05)}
.mob-item:active{opacity:.7}
.mob-item.ok{border-color:#FF7A00;background:#FFF4E8;box-shadow:none}
.mob-chk{width:20px;height:20px;border-radius:50%;border:1.5px solid #C9D3E0;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;color:transparent;transition:all .2s}
.mob-chk.ok{background:#FF7A00;border-color:#FF7A00;color:#fff}
.cal-lbl{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-lbl span{text-align:center;font-size:10px;font-weight:600;color:#8A94A6;padding:2px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-d{display:flex;flex-direction:column;align-items:center;padding:5px 2px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.cal-d.today{border-color:#007AFF;background:#EAF2FE}
.cal-dn{font-size:12px;font-weight:500;color:#007AFF}
.cal-dot{width:5px;height:5px;border-radius:50%;margin-top:2px;background:transparent}
.dayr{background:#fff;border-radius:14px;border:1px solid #EEF1F5;padding:12px;margin-bottom:7px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,122,255,0.04)}
.dayr.today{border-color:#007AFF;border-width:1.5px}
.daydot{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.frow{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}
.frow::-webkit-scrollbar{display:none}
.fbtn{padding:6px 14px;border-radius:20px;border:1px solid #EEF1F5;background:#fff;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:-apple-system,sans-serif;color:#5C6B7F}
.fbtn.on{background:#007AFF;color:#fff;border-color:#007AFF}
#modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(10,20,35,0.45);padding:20px}
#modal.show{display:flex}
#modal-inner{background:#fff;border-radius:22px;width:100%;max-width:380px;padding:0 0 10px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(10,20,35,0.25);animation:modalpop .22s cubic-bezier(0.34,1.56,0.64,1) both}
@keyframes modalpop{0%{opacity:0;transform:scale(.92) translateY(8px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.opt-row{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;border-bottom:1px solid #F2F4F7;border-radius:12px;margin:2px 8px}
.opt-row:active{background:#F7FAFF}
.opt-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
@keyframes popin{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}60%{transform:translate(-50%,-50%) scale(1.05)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes fadeout{0%{opacity:1}100%{opacity:0}}
#cel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:20px;border:1px solid #EEF1F5;padding:28px 36px;text-align:center;z-index:999;display:none;min-width:200px;box-shadow:0 12px 40px rgba(10,20,35,0.18)}
#cel.show{display:block;animation:popin .35s cubic-bezier(0.34,1.56,0.64,1) both}
#cel.hide{animation:fadeout .3s ease both}
#cel-ico{font-size:44px;margin-bottom:8px}
#cel-t{font-size:16px;font-weight:700;color:#007AFF}
.sum-stat{text-align:center;padding:16px;flex:1}
.sum-num{font-size:32px;font-weight:800;color:#007AFF}
.sum-lbl{font-size:11px;color:#8A94A6;margin-top:2px}
.rc-item{background:#fff;border-radius:14px;border:1.5px solid #007AFF;padding:11px 12px;margin-bottom:8px;display:flex;gap:10px;cursor:pointer;box-shadow:0 1px 3px rgba(0,122,255,0.05)}
.rc-item.ok{border-color:#34C77A;background:#F3FBF6;box-shadow:none}
#fab{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+78px);right:16px;width:48px;height:48px;border-radius:50%;background:#007AFF;color:#fff;border:none;font-size:24px;cursor:pointer;z-index:90;box-shadow:0 4px 14px rgba(0,122,255,0.35)}
@keyframes slideInLeft{from{transform:translateX(-100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOutRight{from{transform:translateX(0);opacity:1}to{transform:translateX(100%);opacity:0}}
@keyframes slideInRight{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOutLeft{from{transform:translateX(0);opacity:1}to{transform:translateX(-100%);opacity:0}}
.slide-in-left{animation:slideInLeft .28s cubic-bezier(0.25,0.46,0.45,0.94) both}
.slide-out-right{animation:slideOutRight .28s cubic-bezier(0.25,0.46,0.45,0.94) both}
.slide-in-right{animation:slideInRight .28s cubic-bezier(0.25,0.46,0.45,0.94) both}
.slide-out-left{animation:slideOutLeft .28s cubic-bezier(0.25,0.46,0.45,0.94) both}
#swipe-indicator{position:fixed;left:0;top:0;bottom:0;width:4px;background:linear-gradient(to right,rgba(0,122,255,0.4),transparent);z-index:50;pointer-events:none;opacity:0;transition:opacity .1s}
#swipe-indicator.visible{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="hdr"></div>
  <div id="cnt"></div>
  <button id="fab" style="display:none">+</button>
  <div id="tb"><div class="tb-inner">
    <button class="tbb on" onclick="goTab('hoy',0)" id="tb-hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Hoy</span></button>
    <button class="tbb" onclick="goTab('sem',1)" id="tb-sem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Semana</span></button>
    <button class="tbb" onclick="goTab('mob',2)" id="tb-mob"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg><span>Movilidad</span></button>
    <button class="tbb" onclick="goTab('prog',3)" id="tb-prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Progreso</span></button>
    <button class="tbb" onclick="goTab('cal',4)" id="tb-cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Calendario</span></button>
    <button class="tbb" onclick="goTab('cfg',5)" id="tb-cfg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06-.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Ajustes</span></button>
  </div></div>
  <div id="modal" onclick="if(event.target===this)closeModal()">
    <div id="modal-inner">
      <div id="modal-header" style="padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(0,0,0,0.08)">
        <div style="font-size:14px;font-weight:700" id="modal-title">Título</div>
        <button onclick="closeModal()" style="background:rgba(0,0,0,0.06);border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px">✕</button>

      <div id="modal-body"></div>

<script>
const today=new Date();
const tstr=today.toDateString();
const DNAMES=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const sidx=today.getDay()===0?6:today.getDay()-1;
const SM={
  pf:{l:'Glúteo + Piernas A',c:'#007AFF',bg:'rgba(0,122,255,0.07)'},
  th:{l:'Espalda + Bíceps',c:'#007AFF',bg:'rgba(0,122,255,0.07)'},
  tf:{l:'Pecho + Tríceps',c:'#007AFF',bg:'rgba(0,122,255,0.07)'},
  ph:{l:'Glúteo + Piernas B',c:'#007AFF',bg:'rgba(0,122,255,0.07)'},
};
const DEFAULT_SCHED=['pf','th','tf','ph',null,null,null];
const SPORTS=['Fútbol','Pádel','Voleibol','Surf','Carrera','Ciclismo','Natación','Senderismo','Yoga/Pilates','Otro'];
const WEEK_LABELS=['Base','Carga','Pico','Ligera'];
const TOTAL_MESOS=6;

// ─── DUP VOLUME/INTENSITY SCHEME ──────────────────
// getLoad(week, meso, baseLoad) returns {sets, reps, rest}
// week: 1-4, meso: 1-6
// baseLoad: {s,r,rest} baseline (week1 meso1)
// Progressive overload: meso adds ~5% volume each cycle, week modulates intensity

function getExLoad(ex,sdata,isAcc,week,meso){
  // week: 1-4, meso: 1-6
  // Progression: each meso adds +1 rep to S1 and S2 (within range)
  // When rep ceiling hit -> user bumps level -> reps reset lower
  const m=meso-1; // 0-5
  const w=week;
  const pat=ex?ex.pat:'';

  if(isAcc){
    // Accessories: 3 sets, 10-12 reps, less rest
    // S1:3x10 S2:3x12 S3:3x10 S4:2x10 + meso adds rep each cycle
    const baseReps=[10,12,10,10][w-1];
    const sets=[3,3,3,2][w-1];
    const rest=['60s','60s','60s','45s'][w-1];
    const reps=w<4?Math.min(baseReps+m,15):baseReps; // cap at 15
    return {sets,reps,rest};
  }

  // ── TORSO FUERZA ──────────────────────────────────
  if(pat==='Empuje horizontal'&&sdata.type==='strength'){
    // S1:4x8 S2:4x8 S3:4x6 S4:3x8 | S3 is intensity week: reduce reps, add tempo cue
    const base=[
      {s:4,r:8,rest:'2min',note:''},
      {s:4,r:8,rest:'90s',note:'Reduce descanso 90s'},
      {s:4,r:6,rest:'2min',note:'Tempo 3-0-1 — sube de nivel si puedes'},
      {s:3,r:8,rest:'90s',note:'Descarga'},
    ][w-1];
    const reps=w<4?Math.min(base.r+m,10):base.r; // progression cap 10
    return {sets:base.s,reps,rest:base.rest,note:base.note};
  }
  if(pat==='Empuje vertical'&&sdata.type==='strength'){
    const base=[
      {s:4,r:10,rest:'2min',note:''},
      {s:4,r:10,rest:'90s',note:'Reduce descanso 90s'},
      {s:4,r:8,rest:'2min',note:'Pausa 2s arriba — sube de nivel si puedes'},
      {s:3,r:10,rest:'90s',note:'Descarga'},
    ][w-1];
    const reps=w<4?Math.min(base.r+m,13):base.r;
    return {sets:base.s,reps,rest:base.rest,note:base.note};
  }
  if(pat==='Tracción horizontal'&&sdata.type==='strength'){
    const base=[
      {s:4,r:8,rest:'90s',note:''},
      {s:4,r:8,rest:'75s',note:'Reduce descanso 75s'},
      {s:4,r:6,rest:'90s',note:'Pausa 2s arriba'},
      {s:3,r:8,rest:'75s',note:'Descarga'},
    ][w-1];
    const reps=w<4?Math.min(base.r+m,10):base.r;
    return {sets:base.s,reps,rest:base.rest,note:base.note};
  }
  if(pat==='Tracción vertical'&&sdata.type==='strength'){
    const base=[
      {s:4,r:8,rest:'90s',note:''},
      {s:4,r:8,rest:'75s',note:'Reduce descanso 75s'},
      {s:4,r:6,rest:'90s',note:'Tempo 3-0-1'},
      {s:3,r:8,rest:'75s',note:'Descarga'},
    ][w-1];
    const reps=w<4?Math.min(base.r+m,10):base.r;
    return {sets:base.s,reps,rest:base.rest,note:base.note};
  }

  // ── TORSO HIPERT ──────────────────────────────────
  if(pat==='Empuje horizontal'&&sdata.type==='hyp'){
    const base=[
      {s:4,r:10,rest:'75s',note:''},
      {s:4,r:12,rest:'60s',note:'Reduce descanso 60s'},
      {s:4,r:8,rest:'75s',note:'Tempo 2-0-2'},
      {s:3,r:10,rest:'60s',note:'Descarga'},
    ][w-1];
    const reps=w<4?Math.min(base.r+m,14):base.r;
    return {sets:base.s,reps,rest:base.rest,note:base.note};
  }
  if(pat==='Empuje vertical'&&sdata.type==='hyp'){
    const base=[
      {s:4,r:10,rest:'75s',note:''},
      {s:4,r:12,rest:'60s',note:'Reduce descanso 60s'},
      {s:4,r:8,rest:'75s',note:'Pausa 2s abajo'},
      {s:3,r:10,rest:'60s',note:'Descarga'},
    ][w-1];
    const reps=w<4?Math.min(base.r+m,14):base.r;
    return {sets:base.s,reps,rest:base.rest,note:base.note};
  }
  if(pat==='Tracción horizontal'&&sdata.type==='hyp'){
    const base=[
      {s:4,r:12,rest:'60s',note:''},
      {s:4,r:12,rest:'45s',note:'Reduce descanso 45s'},
      {s:4,r:10,rest:'60s',note:'Tempo 3-0-1'},
      {s:3,r:12,rest:'45s',note:'Descarga'},
    ][w-1];
    const reps=w<4?Math.min(base.r+m,16):base.r;
    return {sets:base.s,reps,rest:base.rest,note:base.note};
  }
  if(pat==='Tracción vertical'&&sdata.type==='hyp'){
    const base=[
      {s:4,r:12,rest:'60s',note:''},
      {s:4,r:12,rest:'45s',note:'Reduce descanso 45s'},
      {s:4,r:10,rest:'60s',note:'Tempo 3-0-1'},
      {s:3,r:12,rest:'45s',note:'Descarga'},
    ][w-1];
    const reps=w<4?Math.min(base.r+m,16):base.r;
    return {sets:base.s,reps,rest:base.rest,note:base.note};
  }

  // ── PIERNA — RDL UNILATERAL ───────────────────────
  if(pat==='Dom. cadera unilateral'){
    const isStr=sdata.type==='strength';
    const base=isStr?[
      {s:3,r:10,rest:'90s',note:''},
      {s:4,r:10,rest:'90s',note:''},
      {s:4,r:8,rest:'90s',note:'Tempo 3-0-1 — siente el estiramiento'},
      {s:3,r:10,rest:'75s',note:'Descarga'},
    ]:[
      {s:3,r:10,rest:'90s',note:''},
      {s:4,r:10,rest:'75s',note:''},
      {s:4,r:8,rest:'90s',note:'Tempo 4-0-1'},
      {s:3,r:10,rest:'60s',note:'Descarga'},
    ];
    const b=base[w-1];
    const reps=w<4?Math.min(b.r+m,12):b.r;
    return {sets:b.s,reps,rest:b.rest,note:b.note,perSide:true};
  }

  // ── PIERNA — SENTADILLA GLÚTEO ────────────────────
  if(pat==='Dom. rodilla glúteo'){
    const isStr=sdata.type==='strength';
    const base=isStr?[
      {s:4,r:10,rest:'90s',note:''},
      {s:4,r:12,rest:'75s',note:''},
      {s:4,r:8,rest:'90s',note:'Pausa 2s abajo'},
      {s:3,r:10,rest:'75s',note:'Descarga'},
    ]:[
      {s:4,r:12,rest:'75s',note:''},
      {s:4,r:12,rest:'60s',note:''},
      {s:4,r:10,rest:'75s',note:'Tempo 3-0-1'},
      {s:3,r:12,rest:'60s',note:'Descarga'},
    ];
    const b=base[w-1];
    const reps=w<4?Math.min(b.r+m,15):b.r;
    return {sets:b.s,reps,rest:b.rest,note:b.note};
  }

  // ── PIERNA — STEP-DOWN ────────────────────────────
  if(pat==='Glúteo unilateral'){
    const isStr=sdata.type==='strength';
    const base=isStr?[
      {s:3,r:10,rest:'75s',note:''},
      {s:3,r:12,rest:'75s',note:''},
      {s:4,r:8,rest:'75s',note:'Pausa 2s arriba — empuja con el talón'},
      {s:3,r:10,rest:'60s',note:'Descarga'},
    ]:[
      {s:3,r:10,rest:'75s',note:''},
      {s:3,r:12,rest:'60s',note:''},
      {s:4,r:10,rest:'75s',note:'Tempo 3-0-1'},
      {s:3,r:12,rest:'60s',note:'Descarga'},
    ];
    const b=base[w-1];
    const reps=w<4?Math.min(b.r+m,14):b.r;
    return {sets:b.s,reps,rest:b.rest,note:b.note,perSide:true};
  }

  // ── PIERNA — HIP THRUST ───────────────────────────
  if(pat==='Glúteo extensión'){
    const isStr=sdata.type==='strength';
    const base=isStr?[
      {s:4,r:10,rest:'75s',note:''},
      {s:4,r:12,rest:'75s',note:''},
      {s:4,r:8,rest:'90s',note:'Pausa 3s arriba apretando glúteo'},
      {s:3,r:10,rest:'60s',note:'Descarga'},
    ]:[
      {s:4,r:12,rest:'75s',note:''},
      {s:4,r:12,rest:'60s',note:''},
      {s:4,r:10,rest:'75s',note:'Pausa 2s + tempo 3-0-1'},
      {s:3,r:12,rest:'60s',note:'Descarga'},
    ];
    const b=base[w-1];
    const reps=w<4?Math.min(b.r+m,15):b.r;
    return {sets:b.s,reps,rest:b.rest,note:b.note};
  }

  // ── PIERNA — CLAMSHELL INVERTIDO ─────────────────
  if(pat==='Glúteo medio'){
    const base=[
      {s:3,r:12,rest:'45s',note:'3s subiendo 3s bajando'},
      {s:3,r:15,rest:'45s',note:'3s subiendo 3s bajando'},
      {s:3,r:12,rest:'45s',note:'Pausa 3s arriba — aprieta el glúteo'},
      {s:2,r:12,rest:'30s',note:'Descarga'},
    ][w-1];
    const reps=w<4?Math.min(base.r+m,18):base.r;
    return {sets:base.s,reps,rest:base.rest,note:base.note,perSide:true};
  }

  // ── CORE MCGILL (sesión miércoles) ───────────────
  if(pat==='Anti-rotación'||pat==='Flexión segura'||pat==='Estabilidad lateral'||pat==='Extensión de cadera'){
    return coreLoad(week,meso,pat);
  }

  // Default fallback
  const isStr=sdata&&sdata.type==='strength';
  return isStr?
    {sets:4,reps:Math.min(8+m,10),rest:'90s',note:''}:
    {sets:4,reps:Math.min(10+m,14),rest:'75s',note:''};
}

// Legacy wrappers for backward compat
function dupLoad(week,meso,type,pat){
  return getExLoad({pat:pat||''},{ type:type,base:[],acc:[] },false,week,meso);
}
function accLoad(week,meso,type){
  return getExLoad(null,{ type:type,base:[],acc:[] },true,week,meso);
}
function coreLoad(week,meso,pat){
  const w=week;const m=meso-1;
  // McGill protocol - time-based for isometric, reps for dynamic
  if(pat==='Estabilidad lateral'){
    // Plancha lateral - time
    const t=[20,25,30,20][w-1]+m*5; // adds 5s per meso, cap at 60s
    return {sets:[3,3,4,2][w-1],reps:Math.min(t,60)+'s',rest:'45s',perSide:true};
  }
  if(pat==='Flexión segura'){
    // McGill curl-up - time hold
    const t=[8,10,10,8][w-1]+m*2;
    return {sets:[3,3,4,2][w-1],reps:Math.min(t,20)+'s',rest:'45s',perSide:false};
  }
  if(pat==='Anti-rotación'){
    // Bird dog - reps with hold time in variant name
    const r=Math.min([8,10,8,8][w-1]+m,12);
    return {sets:[3,3,4,2][w-1],reps:r+'/lado',rest:'60s',perSide:true};
  }
  if(pat==='Extensión de cadera'){
    // Puente - reps
    const r=Math.min([10,12,10,10][w-1]+m,15);
    return {sets:[3,3,4,2][w-1],reps:r,rest:'60s',perSide:false};
  }
  // Default
  return {sets:[3,3,4,2][w-1],reps:Math.min([8,10,8,8][w-1]+m,12)+'/lado',rest:'60s'};
}

function fmtLoad(load, perSide){
  const r = perSide ? load.reps+(typeof load.reps==='number'?'/lado':'') : load.reps;
  return load.sets+'x'+r;
}

function getQuoteDayStr(){
  const d=new Date(today);
  if(d.getHours()<7)d.setDate(d.getDate()-1);
  return d.toDateString();
}
function getTodayQuote(){
  const qd=getQuoteDayStr();
  if(gl('quote_day')===qd){
    const idx=parseInt(gl('quote_idx')||'0');
    return QUOTES[idx]||QUOTES[0];
  }
  let bag=[];try{bag=JSON.parse(gl('quote_bag')||'[]');}catch(e){}
  if(!bag.length){
    bag=QUOTES.map((_,i)=>i);
    for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=bag[i];bag[i]=bag[j];bag[j]=t;}
  }
  const idx=bag.pop();
  sv('quote_bag',JSON.stringify(bag));
  sv('quote_day',qd);
  sv('quote_idx',String(idx));
  return QUOTES[idx];
}
function quotesEnabled(){return gl('quotes_off')!=='1';}
function quotePopupMode(){return gl('quote_popup')||'first';}
function maybeShowQuotePopup(){
  if(!quotesEnabled()||quotePopupMode()==='never')return;

    sv('quote_popup_shown',qd);
    openQuotePopup();
  }
}

    +'<div style="font-size:13px;font-style:italic;font-family:Georgia,\'Times New Roman\',serif;color:#0A2540;line-height:1.5;padding-left:16px">'+q+'</div>'
    +'</div>';
}

function init(){
  const SCHED_VER='v2-lowerA';
  if(gl('schedver')!==SCHED_VER){
    sv('schedver',SCHED_VER);
    sv('sched2',JSON.stringify(DEFAULT_SCHED));
    ST.sched=[...DEFAULT_SCHED];
  } else {
    const sc=gl('sched2');if(sc)try{ST.sched=JSON.parse(sc);}catch(e){}
  }
  ST.sched=ST.sched.map(v=>SESS[v]?v:null);
  sv('sched2',JSON.stringify(ST.sched));
  const wk=gl('wk');if(wk)ST.week=parseInt(wk)||1;
  const ms=gl('meso');if(ms)ST.meso=parseInt(ms)||1;
  const xl=gl('xlv2');if(xl){try{ST.xlv=JSON.parse(xl);}catch(e){}}
  const dn=gl('dn_'+tstr);if(dn)try{ST.done=new Set(JSON.parse(dn));}catch(e){}
  const md=gl('md_'+tstr);if(md)try{ST.mdone=new Set(JSON.parse(md));}catch(e){}
  render();
}

function render(){
  const hd=document.getElementById('hdr');
  document.getElementById('tb').style.display='block';
  hd.innerHTML='<div style="font-size:11px;font-weight:700;color:#999;letter-spacing:.05em">M'+ST.meso+'/'+TOTAL_MESOS+' · S'+ST.week+' · '+WEEK_LABELS[ST.week-1].toUpperCase()+'</div>'
    +'<div style="font-size:20px;font-weight:800;padding:2px 0 10px;color:#111">'+today.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})+'</div>';
  sH(rTab());updateFab();
}

function sH(h,dir){
  const c=document.getElementById('cnt');
  if(!c)return;
  if(!dir){c.innerHTML=h;return;}
  // Animate out
  const outCls=dir==='back'?'slide-out-right':'slide-out-left';
  const inCls=dir==='back'?'slide-in-left':'slide-in-right';
  c.classList.add(outCls);
  setTimeout(function(){
    c.classList.remove(outCls);
    c.innerHTML=h;
    c.classList.add(inCls);
    setTimeout(function(){c.classList.remove(inCls);},300);
  },200);
}
function go(t,dir){
  ST.tab=t;
  document.querySelectorAll('.tbb').forEach(b=>b.classList.remove('on'));
  const el=document.getElementById('tb-'+t);if(el)el.classList.add('on');
  sH(rTab(),dir||null);updateFab();
}
const TAB_ORDER={hoy:0,sem:1,mob:2,prog:3,cal:4,cfg:5};
function goTab(t,idx){
  const cur=TAB_ORDER[ST.tab]||0;
  const dir=idx>cur?'forward':'back';
  go(t,dir);
}
function updateFab(){document.getElementById('fab').style.display='none';}
function rTab(){
  if(ST.tab==='hoy')return rHoy();
  if(ST.tab==='sem')return rSem();
  if(ST.tab==='mob')return rMob();
  if(ST.tab==='prog')return rProg();
  if(ST.tab==='cal')return rCal();
  if(ST.tab==='rc')return rRc();
  if(ST.tab==='medidas')return rMedidas();
  if(ST.tab==='cfg')return rCfg();
  return rHoy();
}

function getLv(id){return ST.xlv[id]!==undefined?ST.xlv[id]:2;}

function getVariant(ex){
  const lv=Math.min(getLv(ex.id),ex.v.length-1);
  return {name:ex.v[lv],lv:lv};
}

function getExReps(ex,sdata){
  const load=sdata.acc&&sdata.acc.includes(ex)?accLoad(ST.week,ST.meso,sdata.type):dupLoad(ST.week,ST.meso,sdata.type);
  const side=ex.perSide?'/lado':'';
  return load.sets+'x'+load.reps+side;
}

function getExRest(ex,sdata){
  const load=sdata.acc&&sdata.acc.includes(ex)?accLoad(ST.week,ST.meso,sdata.type):dupLoad(ST.week,ST.meso,sdata.type);
  return load.rest;
}

function getWeeklyItem(pool,seed){
  const idx=(ST.week-1+ST.meso-1+seed)%pool.length;
  return pool[Math.max(0,idx)];
}

// ── HOY ───────────────────────────────────────────
function rHoy(){
  const sk=ST.sched[sidx];
  let h='';
  h+=renderQuoteCard();
  const mobDone=MOB.filter(m=>ST.mdone.has(m.id)).length;
  h+='<div class="slbl">Mañana</div>';
  h+='<div class="card" style="display:flex;align-items:center;gap:10px;cursor:pointer;border-color:rgba(52,199,89,0.3)" onclick="go(\'mob\')">'
    +'<div style="width:36px;height:36px;border-radius:10px;background:rgba(52,199,89,0.08);display:flex;align-items:center;justify-content:center;font-size:18px">☀️</div>'
    +'<div style="flex:1"><div style="font-size:13px;font-weight:600">Movilidad matutina</div>'
    +'<div style="font-size:11px;color:#999">'+mobDone+'/'+MOB.length+' completados</div></div>'
    +'<div style="font-size:18px;color:#999">›</div></div>';

  if(!sk){
    h+='<div style="text-align:center;padding:32px 16px">'
      +'<div style="font-size:48px;margin-bottom:14px">🌙</div>'
      +'<div style="font-size:18px;font-weight:800;margin-bottom:8px">Día de descanso</div>'
      +'<div style="font-size:13px;color:#999;line-height:1.7;margin-bottom:20px">El descanso es donde el cuerpo crece.<br>Recupera hoy y vuelves más fuerte.</div>'
      +'<button class="btn btn-green" onclick="showRc(\'all\')">🧘 Recuperación activa</button>'
      +'<button class="btn" onclick="showRc(\'espalda_dolor\')" style="color:#007AFF;border-color:rgba(0,122,255,0.2)">🔴 Espalda — aliviar dolor</button>'
      +'<button class="btn" onclick="showRc(\'espalda_prev\')">Espalda — prevención</button></div>';
    return h;
  }

  const sdata=SESS[sk];
  const allIds=[...sdata.base.map(e=>e.id),...sdata.acc.map(e=>e.id)];
  const done=allIds.filter(id=>ST.done.has(id)).length;
  const pct=allIds.length?Math.round(done/allIds.length*100):0;
  const comp=gl('completed_'+tstr)===sk;

  h+='<div class="slbl">Sesión de hoy</div>';
  h+='<div class="card" style="border-color:'+sdata.color+'">'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'
    +'<div style="width:8px;height:8px;border-radius:50%;background:'+sdata.color+'"></div>'
    +'<div style="font-size:14px;font-weight:700">'+sdata.name+'</div></div>'
    +'<div style="display:flex;justify-content:space-between;margin-bottom:5px">'
    +'<span style="font-size:11px;color:#999">Progreso</span>'
    +'<span style="font-size:11px;font-weight:700;color:'+sdata.color+'">'+done+'/'+allIds.length+'</span></div>'
    +'<div class="pb"><div class="pf" style="width:'+pct+'%;background:'+sdata.color+'"></div></div></div>';

  if(!allIds.length){
    h+='<div class="card" style="text-align:center;color:#8A94A6;font-size:12px;padding:20px">Sin ejercicios programados todavía para '+sdata.name+'.</div>';
    return h;
  }
  h+='<div class="slbl">Ejercicios base</div>';
  h+=renderExList(sdata.base,sdata,false);
  if(sdata.acc.length){h+='<div class="slbl">Accesorios</div>';h+=renderExList(sdata.acc,sdata,true);}
  if(sk==='th'||sk==='tf'){h+=renderCoreEssentials();h+=renderCoreFinisher();}

  h+='<button class="btn '+(comp?'btn-green':'btn-orange')+'" style="margin-top:4px" onclick="markCompleted(\''+sk+'\')">'
    +(comp?'✓ Completado — pulsa para desmarcar':'Marcar entrenamiento como completado')+'</button>';
  h+='<button class="btn" onclick="postponeDay()" style="color:#999;font-size:12px">Mover al próximo día de descanso</button>';
  return h;
}

function getWlog(){try{return JSON.parse(gl('wlog')||'{}');}catch(e){return {};}}
function lastWeight(id){const arr=getWlog()[id]||[];return arr.length?arr[arr.length-1]:null;}
function saveWeight(id,val){
  val=parseFloat((val+'').replace(',','.'));
  if(isNaN(val))return;
  const wl=getWlog();if(!wl[id])wl[id]=[];
  const today=tstr;
  const idx=wl[id].findIndex(e=>e.d===today);
  if(idx>=0)wl[id][idx].kg=val;else wl[id].push({d:today,kg:val});
  sv('wlog',JSON.stringify(wl));
  showCel('💪','Peso guardado');
  sH(rTab());
}
function fmtD(ds){const p=ds.split(' ');return p[2]+' '+p[1];}
function getReps(id){return gl('reps_'+id)||'';}
function saveReps(id,val){sv('reps_'+id,val);}

function findEx(id){
  for(const sk in SESS){const f=SESS[sk].base.find(e=>e.id===id);if(f)return f;}
  return null;
}
function getAltIdx(id){const v=gl('alt_'+id);return v?parseInt(v):0;}
function getCurrentExName(ex){
  const idx=getAltIdx(ex.id);
  return idx>0&&ex.alts&&ex.alts[idx-1]?ex.alts[idx-1]:ex.name;
}
function setAlt(id,idx){sv('alt_'+id,idx);closeModal();sH(rTab());}
function openAltModal(id){
  const ex=findEx(id);if(!ex||!ex.alts||!ex.alts.length)return;
  const curIdx=getAltIdx(id);
  let h='<div style="padding:16px 16px 4px"><div style="font-size:15px;font-weight:700">Cambiar ejercicio</div><div style="font-size:11px;color:#8A94A6;margin-top:2px">Mismas series, reps y RIR</div></div>';
  const options=[ex.name,...ex.alts];
  options.forEach((name,i)=>{
    h+='<div class="opt-row" onclick="setAlt(\''+id+'\','+i+')"><div class="opt-dot" style="background:'+(curIdx===i?'#007AFF':'#EEF1F5')+'"></div><div style="flex:1;font-size:13px;font-weight:'+(curIdx===i?'700':'400')+';color:'+(curIdx===i?'#007AFF':'#111')+'">'+name+(i===0?' (principal)':'')+'</div>'+(curIdx===i?'<span style="color:#007AFF">✓</span>':'')+'</div>';
  });
  document.getElementById('modal-body').innerHTML=h;
  document.getElementById('modal').classList.add('show');
}

function splitTarget(t){
  if(!t)return{main:'',rir:''};
  const i=t.indexOf('@RIR');
  if(i===-1)return{main:t,rir:''};
  return{main:t.slice(0,i).trim(),rir:t.slice(i).replace('@','').trim()};
}

function renderExList(exs,sdata,isAcc){
  return exs.map((ex,i)=>renderSimpleEx(ex,sdata,i+1)).join('');
}

function getWeightId(ex){const idx=getAltIdx(ex.id);return idx>0?ex.id+'_alt'+idx:ex.id;}
function getVariantWeightId(ex,idx){return idx>0?ex.id+'_alt'+idx:ex.id;}
function renderSimpleEx(ex,sdata,num){
  const ok=ST.done.has(ex.id);
  const wid=getWeightId(ex);
  const lw=lastWeight(wid);
  const t=splitTarget(ex.target);
  const curName=getCurrentExName(ex);
  const isAlt=curName!==ex.name;
  const c1=ok?'#34C77A':'#007AFF';
  const c2=ok?'#1F8A52':'#0A5FD1';
  const bBg=ok?'#E3F7EA':'#EAF2FE';
  return '<div class="exc'+(ok?' ok':'')+'" style="flex-direction:column;align-items:stretch;gap:0">'
    +'<div style="display:flex;align-items:center;gap:10px" onclick="tapEx(\''+ex.id+'\')">'
    +(num?'<div style="width:26px;height:26px;border-radius:8px;background:'+bBg+';color:'+c1+';font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+num+'</div>':'')
    +'<div style="flex:1;min-width:0">'
    +'<div style="display:flex;align-items:center;gap:6px">'
    +'<div class="xn'+(ok?' ok':'')+'" style="flex:1">'+curName+'</div>'
    +(ex.alts&&ex.alts.length?'<button onclick="event.stopPropagation();openAltModal(\''+ex.id+'\')" style="flex-shrink:0;background:'+bBg+';border:none;border-radius:7px;padding:4px 7px;font-size:11px;color:'+c1+';cursor:pointer">🔄</button>':'')
    +'</div>'
    +(isAlt?'<div style="font-size:9.5px;color:#8A94A6;margin-top:1px">alternativa de '+ex.name+'</div>':'')
    +(t.main?'<div style="display:flex;gap:5px;margin-top:4px;flex-wrap:wrap">'
      +'<span style="font-size:10px;background:'+bBg+';color:'+c2+';padding:3px 8px;border-radius:7px;font-weight:700">'+t.main+'</span>'
      +(t.rir?'<span style="font-size:10px;background:'+bBg+';color:'+c2+';padding:3px 8px;border-radius:7px;font-weight:700">'+t.rir+'</span>':'')
      +'</div>':'')
    +'</div>'
    +'<div style="width:1px;align-self:stretch;background:#EEF1F5;margin:0 2px"></div>'
    +'<div style="display:flex;align-items:center;gap:3px;flex-shrink:0" onclick="event.stopPropagation()">'
    +'<input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" placeholder="0" value="'+(lw?lw.kg:'')+'" onchange="saveWeight(\''+wid+'\',this.value)" style="width:42px;text-align:center;border:1.5px solid '+c1+';border-radius:8px;padding:5px 2px;font-size:14px;font-weight:700;color:'+c1+';background:none;font-family:-apple-system,sans-serif">'
    +'<span style="font-size:11px;font-weight:700;color:'+c1+'">kg</span></div>'
    +'<div class="chk'+(ok?' ok':'')+'" style="flex-shrink:0">✓</div>'
    +'</div>'
    +'<div style="font-size:10.5px;color:#8A94A6;margin-top:6px;padding-left:36px">'
    +(lw?'Último: <strong style="color:'+c1+'">'+lw.kg+'kg</strong> · '+fmtD(lw.d):'Sin registros aún')
    +'</div></div>';
}

function renderCoreEssentials(){
  let h='<div class="slbl">Core Essentials</div>';
  h+=CORE_ESSENTIALS.map(ex=>{
    const ok=ST.done.has(ex.id);
    const c2=ok?'#1F8A52':'#0A5FD1';
    const bBg=ok?'#E3F7EA':'#EAF2FE';
    return '<div class="exc'+(ok?' ok':'')+'" onclick="tapEx(\''+ex.id+'\')"><div style="flex:1"><div class="xn'+(ok?' ok':'')+'">'+ex.name+'</div>'+(ex.target?'<div style="font-size:10px;background:'+bBg+';color:'+c2+';padding:3px 8px;border-radius:7px;font-weight:700;display:inline-block;margin-top:5px">'+ex.target+'</div>':'')+'</div><div class="chk'+(ok?' ok':'')+'">✓</div></div>';
  }).join('');
  return h;
}

function pickCoreOpt(catIdx,optId){
  sv('corepick_'+catIdx,optId);
  if(!ST.done.has(optId))ST.done.add(optId);
  sv('dn_'+tstr,JSON.stringify([...ST.done]));
  sH(rTab());
}

function renderCoreFinisher(){
  let h='<div class="slbl">Core Finisher · elige 1 de cada categoría</div>';
  h+='<div class="card" style="font-size:11px;color:#5C6B7F;line-height:1.6;margin-bottom:8px">➡️ Realiza los 4 ejercicios elegidos de forma consecutiva, descansa 45-60s y repite el circuito 3 veces.</div>';
  CORE_FINISHER_CATS.forEach((cat,ci)=>{
    const picked=gl('corepick_'+ci);
    h+='<div class="card" style="padding:11px 12px;margin-bottom:8px">'
      +'<div style="font-size:11px;font-weight:700;color:#8A94A6;text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px">'+cat.cat+'</div>'
      +'<div class="frow" style="margin-bottom:0">'
      +cat.opts.map(o=>'<button class="fbtn'+(picked===o.id?' on':'')+'" onclick="pickCoreOpt('+ci+',\''+o.id+'\')">'+o.name+(o.target?' · '+o.target:'')+'</button>').join('')
      +'</div></div>';
  });
  return h;
}

function toggleDesc(id){const el=document.getElementById('xd_'+id);if(el)el.classList.toggle('show');}
function tapEx(id){
  if(ST.done.has(id))ST.done.delete(id);else ST.done.add(id);
  sv('dn_'+tstr,JSON.stringify([...ST.done]));sH(rTab());
}

function markCompleted(sk){
  const key='completed_'+tstr;
  if(gl(key)===sk){localStorage.removeItem(key);ST.done=new Set();sv('dn_'+tstr,'[]');}
  else{
    const sdata=SESS[sk];
    [...sdata.base,...sdata.acc].forEach(e=>ST.done.add(e.id));
    sv('dn_'+tstr,JSON.stringify([...ST.done]));sv(key,sk);
    showCel('💪','¡Sesión completada!');
  }
  sH(rTab());
}

function postponeDay(){
  for(let d=sidx+1;d<7;d++){
    if(!ST.sched[d]){const tmp=ST.sched[sidx];ST.sched[sidx]=null;ST.sched[d]=tmp;sv('sched2',JSON.stringify(ST.sched));sH(rTab());return;}
  }
  alert('No hay día de descanso disponible esta semana.');
}

function showCel(ico,txt){
  const el=document.getElementById('cel');
  document.getElementById('cel-ico').textContent=ico;
  document.getElementById('cel-t').textContent=txt;
  el.className='show';
  setTimeout(()=>{el.className='hide';setTimeout(()=>{el.className='';},300);},2200);
}

// ── SEMANA ─────────────────────────────────────────
function rSem(){
  let h='<div class="slbl">Esta semana — S'+ST.week+' '+WEEK_LABELS[ST.week-1]+'</div>';
  for(let i=0;i<7;i++){
    const sk=ST.sched[i];const sm=sk?SM[sk]:null;const sdata=sk?SESS[sk]:null;
    const isT=i===sidx;
    const d=new Date(today);d.setDate(today.getDate()-sidx+i);
    const ds=d.toDateString();const comp=gl('completed_'+ds);
    h+='<div class="dayr'+(isT?' today':'')+'" onclick="toggleDayDetail('+i+')" id="dayrow-'+i+'">'
      +'<div class="daydot" style="background:'+(sm?sm.bg:'rgba(0,0,0,0.04)')+';color:'+(sm?sm.c:'#ccc')+'">'+DNAMES[i].slice(0,2)+'</div>'
      +'<div style="flex:1">'
      +'<div style="font-size:13px;font-weight:600">'+DNAMES[i]+(isT?' <span style="font-size:10px;background:rgba(0,122,255,0.1);color:#007AFF;padding:1px 7px;border-radius:99px">Hoy</span>':'')+'</div>'
      +'<div style="font-size:11px;color:#999;margin-top:1px">'+(sdata?sdata.name:'Descanso')+'</div></div>'
      +(comp?'<span style="font-size:16px">✅</span>':'')
      +'<button onclick="event.stopPropagation();openSessModal('+i+')" style="background:rgba(0,0,0,0.05);border:1px solid rgba(0,0,0,0.08);border-radius:8px;padding:4px 8px;font-size:11px;cursor:pointer;color:#555;font-family:-apple-system,sans-serif;flex-shrink:0">✏️</button>'
      +'</div>'
      +'<div id="detail-'+i+'" style="display:none;padding:0 0 4px"></div>';
  }
  return h;
}

function toggleDayDetail(i){
  const det=document.getElementById('detail-'+i);if(!det)return;
  if(det.style.display==='block'){det.style.display='none';return;}
  document.querySelectorAll('[id^="detail-"]').forEach(d=>d.style.display='none');
  const sk=ST.sched[i];
  if(!sk){
    det.innerHTML='<div style="font-size:12px;color:#999;padding:8px 4px">Día de descanso.</div>';
  } else {
    const sdata=SESS[sk];
    let html='<div style="padding:6px 4px">';
    if(!sdata.base.length&&!sdata.acc.length){
      html+='<div style="font-size:12px;color:#999">Sin ejercicios programados todavía.</div>';
    }
    [...sdata.base,...sdata.acc].forEach(ex=>{
      const lw=lastWeight(getWeightId(ex));
      html+='<div style="font-size:12px;padding:4px 0;border-bottom:1px solid rgba(0,0,0,0.05)">'
        +'<div style="display:flex;justify-content:space-between"><span style="color:#444">'+getCurrentExName(ex)+'</span><span style="color:'+sdata.color+';font-weight:600">'+(lw?lw.kg+'kg':'—')+'</span></div>'
        +(ex.target?'<div style="font-size:10px;color:#8A94A6;margin-top:1px">'+ex.target+'</div>':'')
        +'</div>';
    });
    if(sk==='th'||sk==='tf'){
      html+='<div style="font-size:11px;color:#8A94A6;padding:6px 0 2px">+ Core Essentials y Core Finisher</div>';
    }
    html+='</div>';
    det.innerHTML=html;
  }
  det.style.display='block';
}

function openSessModal(dayIdx){
  document.getElementById('modal-title').textContent='Cambiar — '+DNAMES[dayIdx];
  const cur=ST.sched[dayIdx];let html='';
  Object.keys(SM).forEach(sk=>{
    const sm=SM[sk];const sdata=SESS[sk];const isC=cur===sk;

      +'<div class="opt-dot" style="background:'+sm.c+'"></div>'

      +(isC?'<span style="color:'+sm.c+'">✓</span>':'')+'</div>';
  });
  html+='<div style="padding:8px 16px 4px;font-size:10px;font-weight:700;color:#999;text-transform:uppercase">Opciones</div>';
  html+='<div class="opt-row" onclick="setSess('+dayIdx+',null)"><div class="opt-dot" style="background:#ccc"></div>'
    +'<div style="flex:1"><div style="font-size:13px;font-weight:'+(cur===null?'700':'400')+'">Descanso</div></div>'+(cur===null?'<span>✓</span>':'')+'</div>';
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('modal').classList.add('show');
}
function setSess(dayIdx,sk){ST.sched[dayIdx]=sk;sv('sched2',JSON.stringify(ST.sched));closeModal();sH(rSem());}
function closeModal(){document.getElementById('modal').classList.remove('show');document.getElementById('modal-header').style.display='';}

// ── MOVILIDAD ──────────────────────────────────────
function rMob(){
  const done=MOB.filter(m=>ST.mdone.has(m.id)).length;
  let h='<div class="slbl">Movilidad matutina</div>';
  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
    +'<span style="font-size:13px;font-weight:600">'+done+'/'+MOB.length+' completados</span>'
    +'<button class="btn btn-green" style="width:auto;padding:6px 14px;margin:0;font-size:12px" onclick="completeAllMob()">'+(done===MOB.length?'↺ Desmarcar todo':'✓ Completar todo')+'</button></div>'
    +'<div class="pb"><div class="pf" style="width:'+Math.round(done/MOB.length*100)+'%;background:#FF7A00"></div></div></div>';
  h+='<div class="frow">'
    +'<button class="fbtn on" onclick="switchMob(\'main\',this)">Movilidad</button>'
    +'<button class="fbtn" onclick="switchMob(\'espalda_prev\',this)">Espalda prevención</button>'
    +'<button class="fbtn" onclick="switchMob(\'espalda_dolor\',this)" style="border-color:rgba(0,122,255,0.3);color:#007AFF">🔴 Espalda dolor</button>'
    +'</div><div id="mob-list">'+buildMobList(MOB,'#FF7A00')+'</div>';
  return h;
}
function buildMobList(items,color){
  return items.map(m=>{
    const ok=ST.mdone.has(m.id);
    return '<div class="mob-item'+(ok?' ok':'')+'" onclick="tapMob(\''+m.id+'\')">'
      +'<div style="flex:1"><div style="font-size:13px;font-weight:600">'+m.n+'</div>'
      +'<div style="font-size:11px;color:#999;margin-top:2px;line-height:1.4">'+m.desc+'</div></div>'
      +'<div style="text-align:right;flex-shrink:0"><div style="font-size:11px;font-weight:700;color:'+color+'">'+m.r+'</div>'
      +'<div class="mob-chk'+(ok?' ok':'')+'">✓</div></div></div>';
  }).join('');
}
let CUR_MOB_TYPE='main';
function switchMob(type,btn){
  CUR_MOB_TYPE=type;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  const list=document.getElementById('mob-list');if(!list)return;
  if(type==='main')list.innerHTML=buildMobList(MOB,'#FF7A00');
  else if(type==='espalda_prev')list.innerHTML='<div style="background:rgba(0,122,255,0.05);border:1px solid rgba(0,122,255,0.15);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:12px;color:#007AFF">Protocolo de fortalecimiento lumbar — sin dolor activo.</div>'+buildMobList(MOB_EXTRA.espalda_prev,'#007AFF');
  else list.innerHTML='<div style="background:rgba(0,122,255,0.05);border:1px solid rgba(0,122,255,0.15);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:12px;color:#007AFF">⚠️ Con dolor agudo repite 2-3 veces al día.</div>'+buildMobList(MOB_EXTRA.espalda_dolor,'#007AFF');
}
function tapMob(id){
  if(ST.mdone.has(id))ST.mdone.delete(id);else ST.mdone.add(id);
  sv('md_'+tstr,JSON.stringify([...ST.mdone]));
  if(MOB.every(m=>ST.mdone.has(m.id)))sv('mob_completed_'+tstr,'1');
  else localStorage.removeItem('mob_completed_'+tstr);
  const list=document.getElementById('mob-list');if(!list)return;
  if(CUR_MOB_TYPE==='main')list.innerHTML=buildMobList(MOB,'#FF7A00');
  else if(CUR_MOB_TYPE==='espalda_prev')list.innerHTML=buildMobList(MOB_EXTRA.espalda_prev,'#007AFF');
  else list.innerHTML=buildMobList(MOB_EXTRA.espalda_dolor,'#007AFF');
  const done=MOB.filter(m=>ST.mdone.has(m.id)).length;
  const span=document.querySelector('#cnt .card span');if(span)span.textContent=done+'/'+MOB.length+' completados';
}
function completeAllMob(){
  if(MOB.every(m=>ST.mdone.has(m.id)))MOB.forEach(m=>ST.mdone.delete(m.id));
  else{MOB.forEach(m=>ST.mdone.add(m.id));showCel('☀️','¡Movilidad completada!');}
  sv('md_'+tstr,JSON.stringify([...ST.mdone]));
  // Also mark mob_completed for calendar dot
  if(MOB.every(m=>ST.mdone.has(m.id)))sv('mob_completed_'+tstr,'1');
  else localStorage.removeItem('mob_completed_'+tstr);
  sH(rMob());
}

// ── RECOVERY ───────────────────────────────────────
function showRc(type){ST._rc=type;ST.tab='rc';sH(rRc());}
function rRc(){
  const type=ST._rc||'all';
  let items=[],title='Recuperación activa',color='#FF7A00';
  if(type==='espalda_dolor'){items=MOB_EXTRA.espalda_dolor;title='Espalda — aliviar dolor';color='#007AFF';}
  else if(type==='espalda_prev'){items=MOB_EXTRA.espalda_prev;title='Espalda — prevención';color='#007AFF';}
  else items=[...MOB_EXTRA.espalda_dolor.slice(0,3),...MOB_EXTRA.espalda_prev.slice(0,3)];
  const done=items.filter(e=>ST.done.has('rc_'+e.id)).length;
  let h='<button class="btn" onclick="go(\'hoy\')" style="color:#007AFF;border-color:rgba(0,122,255,0.2)">← Volver</button>';
  h+='<div class="slbl">'+title+'</div>';
  if(type==='espalda_dolor')h+='<div style="background:rgba(0,122,255,0.05);border:1px solid rgba(0,122,255,0.15);border-radius:12px;padding:11px 13px;margin-bottom:10px;font-size:12px;color:#007AFF;line-height:1.6">⚠️ Si el dolor se irradia hacia la pierna o llevas más de 72h, consulta con un profesional.<br><br>🔁 <strong>Repite 2-3 veces hoy</strong> en sesiones de 10-15 minutos.</div>';
  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
    +'<span style="font-size:13px;font-weight:600">'+done+'/'+items.length+' completados</span>'
    +'<button class="btn" style="width:auto;padding:5px 12px;margin:0;font-size:12px;background:'+color+';color:#fff;border-color:'+color+'" onclick="completeAllRc()">Completar todo</button></div>'
    +'<div class="pb"><div class="pf" style="width:'+Math.round(done/items.length*100)+'%;background:'+color+'"></div></div></div>';
  items.forEach(ex=>{
    const ok=ST.done.has('rc_'+ex.id);
    h+='<div class="rc-item'+(ok?' ok':'')+'" onclick="tapRcEx(\''+ex.id+'\')">'
      +'<div style="flex:1"><div style="font-size:13px;font-weight:600">'+ex.n+'</div>'
      +'<div style="font-size:11px;color:#999;margin-top:3px;line-height:1.5">'+ex.desc+'</div>'
      +'<div style="font-size:11px;color:#007AFF;margin-top:3px">💡 '+ex.tip+'</div></div>'
      +'<div style="flex-shrink:0;text-align:right"><div style="font-size:11px;font-weight:700;color:'+color+'">'+ex.r+'</div>'
      +'<div class="mob-chk'+(ok?' ok':'')+'">✓</div></div></div>';
  });
  return h;
}
function tapRcEx(id){
  const k='rc_'+id;if(ST.done.has(k))ST.done.delete(k);else ST.done.add(k);
  sv('dn_'+tstr,JSON.stringify([...ST.done]));sH(rRc());
}
function completeAllRc(){
  const type=ST._rc||'all';let items=[];
  if(type==='espalda_dolor')items=MOB_EXTRA.espalda_dolor;
  else if(type==='espalda_prev')items=MOB_EXTRA.espalda_prev;
  else items=[...MOB_EXTRA.espalda_dolor.slice(0,3),...MOB_EXTRA.espalda_prev.slice(0,3)];
  const allDone=items.every(e=>ST.done.has('rc_'+e.id));
  if(allDone)items.forEach(e=>ST.done.delete('rc_'+e.id));
  else{items.forEach(e=>ST.done.add('rc_'+e.id));showCel('🧘','¡Recuperación completada!');}
  sv('dn_'+tstr,JSON.stringify([...ST.done]));sH(rRc());
}

// ── OBJETIVOS ──────────────────────────────────────
function goalKey(g,ds){return 'goal_'+g+'_'+(ds||tstr);}
function isGoalDone(g,ds){return !!gl(goalKey(g,ds));}
function toggleGoalDay(g,ds){ds=ds||tstr;const k=goalKey(g,ds);if(gl(k))localStorage.removeItem(k);else sv(k,'1');sH(rTab());}
function countGoalTotal(g){
  let c=0;
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('goal_'+g+'_')===0)c++;}
  return c;
}
function goalStreak(g){
  let streak=0,d=new Date(today);
  while(isGoalDone(g,d.toDateString())){streak++;d.setDate(d.getDate()-1);}
  return streak;
}
function getCardioLog(){try{return JSON.parse(gl('cardio_log')||'[]');}catch(e){return [];}}
function logCardio(){const log=getCardioLog();log.push(tstr);sv('cardio_log',JSON.stringify(log));showCel('🏃','Sesión de cardio registrada');sH(rTab());}
function undoCardio(){const log=getCardioLog();const idx=log.lastIndexOf(tstr);if(idx>=0){log.splice(idx,1);sv('cardio_log',JSON.stringify(log));sH(rTab());}}
function cardioWeekCount(wkStart){
  const wkEnd=new Date(wkStart);wkEnd.setDate(wkStart.getDate()+6);wkEnd.setHours(23,59,59,999);
  return getCardioLog().filter(function(ds){const d=new Date(ds);return d>=wkStart&&d<=wkEnd;}).length;
}
function curWeekStart(){const w=new Date(today);w.setDate(today.getDate()-sidx);w.setHours(0,0,0,0);return w;}
function weekCardioCount(){return cardioWeekCount(curWeekStart());}
function cardioStreakWeeks(){
  let streak=0,wk=curWeekStart();
  while(cardioWeekCount(wk)>=2){streak++;wk=new Date(wk);wk.setDate(wk.getDate()-7);}
  return streak;
}
function renderObjetivos(){
  const pasosOk=isGoalDone('steps'),suenoOk=isGoalDone('sleep');
  const wc=weekCardioCount(),cardioOkWeek=wc>=2,cardioTotal=getCardioLog().length;
  const psStreak=goalStreak('steps'),slStreak=goalStreak('sleep'),cStreak=cardioStreakWeeks();
  let h='<div class="slbl">Objetivos</div>';

    +'<div style="flex:1"><div style="font-size:13px;font-weight:600">🚶 Pasos — mínimo 7.000</div>'
    +'<div style="font-size:11px;color:#8A94A6;margin-top:2px">'+(psStreak?'🔥 '+psStreak+' día'+(psStreak===1?'':'s')+' seguidos':'Objetivo diario')+'</div></div></div>';
  h+='<div class="mob-item" style="'+(suenoOk?'border-color:#6C4FD1;background:#F5F2FF':'')+'" onclick="toggleGoalDay(\'sleep\')">'
    +'<div class="mob-chk" style="'+(suenoOk?'background:#6C4FD1;border-color:#6C4FD1':'')+'">✓</div>'
    +'<div style="flex:1"><div style="font-size:13px;font-weight:600">😴 Sueño — 7-9 horas</div>'
    +'<div style="font-size:11px;color:#8A94A6;margin-top:2px">'+(slStreak?'🔥 '+slStreak+' día'+(slStreak===1?'':'s')+' seguidos':'Objetivo diario')+'</div></div></div>';
  h+='<div class="mob-item" style="'+(cardioOkWeek?'border-color:#E5484D;background:#FDECEC':'')+'" onclick="logCardio()">'
    +'<div class="mob-chk" style="'+(cardioOkWeek?'background:#E5484D;border-color:#E5484D':'')+'">✓</div>'
    +'<div style="flex:1"><div style="font-size:13px;font-weight:600">🏃 Cardio Zona 2 — 2 sesiones 20-40min/sem</div>'
    +'<div style="font-size:11px;color:#8A94A6;margin-top:2px">'+wc+'/2 esta semana'+(cStreak?' · 🔥 '+cStreak+' semana'+(cStreak===1?'':'s'):'')+' · '+cardioTotal+' totales</div></div></div>';
  if(cardioTotal)h+='<button class="btn" onclick="undoCardio()" style="font-size:11px;color:#8A94A6;padding:8px;margin-bottom:12px">Deshacer última sesión de cardio</button>';
  return h;
}

// ── CALENDARIO ─────────────────────────────────────
function rCal(){
  const y=ST.calY,m=ST.calM;
  const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  let h='<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px">'
    +'<button onclick="calNav(-1)" style="background:none;border:none;font-size:22px;cursor:pointer;color:#007AFF;padding:0 8px">‹</button>'
    +'<div style="font-size:15px;font-weight:700">'+months[m]+' '+y+'</div>'
    +'<button onclick="calNav(1)" style="background:none;border:none;font-size:22px;cursor:pointer;color:#007AFF;padding:0 8px">›</button></div>';
  h+='<div class="cal-lbl">';['L','M','X','J','V','S','D'].forEach(d=>h+='<span>'+d+'</span>');h+='</div><div class="cal-grid">';
  const first=new Date(y,m,1).getDay();const off=first===0?6:first-1;const days=new Date(y,m+1,0).getDate();
  for(let i=0;i<off;i++)h+='<div></div>';
  for(let d=1;d<=days;d++){
    const ds=new Date(y,m,d).toDateString();const isT=ds===tstr;
    const comp=gl('completed_'+ds);const sport=gl('sport_'+ds);const mob=gl('mob_completed_'+ds)||gl('md_'+ds);
    const sm=comp&&SM[comp]?SM[comp]:null;const isFuture=new Date(y,m,d)>today;
    const dots=[];
    if(sm)dots.push(sm.c);
    if(mob)dots.push('#FF7A00');
    if(sport)dots.push('#007AFF');
    if(isGoalDone('steps',ds))dots.push('#FFD60A');
    if(isGoalDone('sleep',ds))dots.push('#6C4FD1');
    if(getCardioLog().indexOf(ds)>=0)dots.push('#E5484D');
    h+='<div class="cal-d'+(isT?' today':'')+'" onclick="'+(isFuture?'':'calDay(\''+ds+'\')')+'" style="'+(isFuture?'opacity:.35':'cursor:pointer')+'">'
      +'<div class="cal-dn" style="font-weight:'+(isT?'800':'400')+';color:'+(isT?'#007AFF':'')+'">'+d+'</div>'
      +'<div style="display:flex;gap:1.5px;margin-top:2px;justify-content:center">'+dots.map(function(c){return '<div style="width:3px;height:3px;border-radius:50%;background:'+c+';flex-shrink:0"></div>';}).join('')+'</div></div>';
  }
  h+='</div>';
  h+='<div style="display:flex;gap:10px;padding:14px 2px;flex-wrap:wrap">';

function calDay(ds){

    +'<div onclick="toggleCalMob(\''+ds+'\')" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:'+(mob?'rgba(255,122,0,0.08)':'rgba(0,0,0,0.03)')+';cursor:pointer;border:1px solid '+(mob?'rgba(255,122,0,0.3)':'rgba(0,0,0,0.06)')+'">'
    +'<div style="width:10px;height:10px;border-radius:50%;background:#FF7A00"></div>'
    +'<div style="flex:1;font-size:13px;font-weight:'+(mob?'700':'400')+';color:'+(mob?'#B85C00':'#111')+'">Movilidad matutina</div>'
    +(mob?'<span style="color:#FF7A00">✓</span>':'')+'</div></div>';
  const gS=isGoalDone('steps',ds),gL=isGoalDone('sleep',ds),gC=getCardioLog().indexOf(ds)>=0;
  h+='<div class="card"><div style="font-size:12px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">Objetivos</div>'
    +'<div onclick="toggleGoalForDay(\'steps\',\''+ds+'\')" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;margin-bottom:6px;background:'+(gS?'rgba(255,214,10,0.12)':'rgba(0,0,0,0.03)')+';cursor:pointer;border:1px solid '+(gS?'rgba(255,214,10,0.4)':'rgba(0,0,0,0.06)')+'">'
    +'<div style="width:10px;height:10px;border-radius:50%;background:#FFD60A"></div>'
    +'<div style="flex:1;font-size:13px;font-weight:'+(gS?'700':'400')+'">🚶 Pasos (7.000+)</div>'
    +(gS?'<span style="color:#B8940A">✓</span>':'')+'</div>'
    +'<div onclick="toggleGoalForDay(\'sleep\',\''+ds+'\')" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;margin-bottom:6px;background:'+(gL?'rgba(108,79,209,0.1)':'rgba(0,0,0,0.03)')+';cursor:pointer;border:1px solid '+(gL?'rgba(108,79,209,0.3)':'rgba(0,0,0,0.06)')+'">'
    +'<div style="width:10px;height:10px;border-radius:50%;background:#6C4FD1"></div>'
    +'<div style="flex:1;font-size:13px;font-weight:'+(gL?'700':'400')+'">😴 Sueño (7-9h)</div>'
    +(gL?'<span style="color:#6C4FD1">✓</span>':'')+'</div>'
    +'<div onclick="'+(gC?'undoCardioForDay':'logCardioForDay')+'(\''+ds+'\')" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:'+(gC?'rgba(229,72,77,0.1)':'rgba(0,0,0,0.03)')+';cursor:pointer;border:1px solid '+(gC?'rgba(229,72,77,0.3)':'rgba(0,0,0,0.06)')+'">'
    +'<div style="width:10px;height:10px;border-radius:50%;background:#E5484D"></div>'
    +'<div style="flex:1;font-size:13px;font-weight:'+(gC?'700':'400')+'">🏃 Sesión cardio Z2</div>'
    +(gC?'<span style="color:#E5484D">✓</span>':'')+'</div></div>';
  if(sport){
    h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'

      +'</div>';

function deleteCalSport(ds){localStorage.removeItem('sport_'+ds);calDay(ds);showCel('🗑','Deporte eliminado');}

// ── SWIPE BACK ────────────────────────────────────────
(function(){
  let sx=0,sy=0,act=false;
  const ind=function(){return document.getElementById('swipe-indicator');};
  document.addEventListener('touchstart',function(e){
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;
    act=sx<44;
    if(act&&ind())ind().classList.add('visible');
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!act)return;
    const dx=e.touches[0].clientX-sx;
    if(dx>0&&ind()){
      ind().style.width=Math.min(4+dx*0.15,32)+'px';
    }
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(ind()){ind().classList.remove('visible');ind().style.width='4px';}
    if(!act)return;
    const dx=e.changedTouches[0].clientX-sx;
    const dy=Math.abs(e.changedTouches[0].clientY-sy);
    if(dx>80&&dy<60)goBack();
    act=false;
  },{passive:true});
  document.addEventListener('touchstart',function(e){
    if(document.getElementById('modal').classList.contains('show')&&e.target===document.getElementById('modal'))closeModal();
  },{passive:true});
})();

function goBack(){
  if(document.getElementById('modal').classList.contains('show')){closeModal();return;}
  if(ST.tab==='rc'){go('hoy');return;}
  // If in day detail in sem, close it
  const openDetail=document.querySelector('[id^="detail-"][style*="block"]');
  if(openDetail){openDetail.style.display='none';return;}
  go('hoy');
}

// ── MEDIDAS ────────────────────────────────────────
var MEDIDAS=[
  {k:'Pecho',tip:'Cinta horizontal a la altura de los pectorales, brazos relajados.',mejor:'subir'},
  {k:'Cintura',tip:'Punto más estrecho del abdomen, sin apretar la cinta.',mejor:'bajar'},
  {k:'Cadera',tip:'Punto más ancho de la cadera/glúteo, de pie con los pies juntos.',mejor:'subir'},
  {k:'Glúteo',tip:'Punto más ancho del glúteo, de pie.',mejor:'subir'},
  {k:'Muslo der.',tip:'Parte más ancha del muslo derecho.',mejor:'subir'},
  {k:'Muslo izq.',tip:'Igual que el muslo derecho.',mejor:'subir'},
  {k:'Brazo der.',tip:'Bíceps derecho en tensión, parte más ancha.',mejor:'subir'},
  {k:'Brazo izq.',tip:'Igual que el brazo derecho.',mejor:'subir'},
];
var MEDIDAS_KEYS=MEDIDAS.map(function(m){return m.k;});
function getMedRecs(){var r=[];try{r=JSON.parse(gl('medidas_records')||'[]');}catch(e){}return r;}
function getMedidasSummary(){
  var recs=getMedRecs();
  if(!recs.length)return 'Sin registros — mide al final de cada mesociclo';
  var d=new Date(recs[recs.length-1].date);
  return 'Último: '+d.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})+' · '+recs.length+' registro'+(recs.length>1?'s':'');
}
function medDelta(recs,k){
  if(recs.length<2)return null;
  var base=recs[0].data[k],last=recs[recs.length-1].data[k];
  if(!base||!last)return null;
  return{diff:parseFloat((last-base).toFixed(1)),pct:parseFloat(((last-base)/base*100).toFixed(1))};
}
function medDeltaColor(delta,mejor){
  if(!delta)return '#999';
  return mejor==='subir'?(delta.diff>0?'#34C759':'#007AFF'):(delta.diff<0?'#34C759':'#007AFF');
}
function buildMedChart(recs,key,W,H,PAD){
  var pts=recs.map(function(r,i){return{x:i,y:r.data[key],d:new Date(r.date)};}).filter(function(p){return p.y;});
  if(pts.length<2)return '<div style="text-align:center;padding:20px;font-size:12px;color:#999">Necesitas al menos 2 registros.</div>';
  var minY=Math.min.apply(null,pts.map(function(p){return p.y;}))-2;
  var maxY=Math.max.apply(null,pts.map(function(p){return p.y;}))+2;
  var n=pts.length;
  function cx(i){return PAD+(i/(n-1))*(W-PAD*2);}
  function cy(v){return H-PAD-((v-minY)/(maxY-minY))*(H-PAD*2);}
  var path='M';pts.forEach(function(p,i){path+=(i?'L':'')+cx(i).toFixed(1)+','+cy(p.y).toFixed(1);});
  var els='';
  pts.forEach(function(p,i){
    els+='<circle cx="'+cx(i).toFixed(1)+'" cy="'+cy(p.y).toFixed(1)+'" r="4" fill="#007AFF"/>';
    els+='<text x="'+cx(i).toFixed(1)+'" y="'+(cy(p.y)-9).toFixed(1)+'" text-anchor="middle" font-size="10" fill="#333">'+p.y+'</text>';
    if(i===0||i===n-1)els+='<text x="'+cx(i).toFixed(1)+'" y="'+(H-4)+'" text-anchor="'+(i===0?'start':'end')+'" font-size="9" fill="#999">'+p.d.toLocaleDateString('es-ES',{day:'numeric',month:'short'})+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block;margin:0 auto 10px"><path d="'+path+'" fill="none" stroke="rgba(0,122,255,0.3)" stroke-width="2"/><path d="'+path+'L'+cx(n-1).toFixed(1)+','+H+' L'+cx(0).toFixed(1)+','+H+' Z" fill="rgba(0,122,255,0.06)"/>'+els+'</svg>';
}
function switchMedChart(key,btn){
  document.querySelectorAll('#med-chart-sel .fbtn').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  var wrap=document.getElementById('med-chart-wrap');
  if(wrap)wrap.innerHTML=buildMedChart(getMedRecs(),key,340,120,30);
}
function rMedChart(recs){
  var h='<div class="slbl">Evolución</div><div class="frow" id="med-chart-sel">';
  MEDIDAS_KEYS.forEach(function(k,i){
    if(recs.some(function(r){return r.data[k];}))h+='<button class="fbtn'+(i===0?' on':'')+'" onclick="switchMedChart(\''+k+'\',this)">'+k+'</button>';
  });
  var fk=MEDIDAS_KEYS.find(function(k){return recs.some(function(r){return r.data[k];});});
  return h+'</div><div id="med-chart-wrap">'+buildMedChart(recs,fk,340,120,30)+'</div>';
}
function rMedidas(){
  var recs=getMedRecs();
  var h='<button class="btn" onclick="go(\'prog\',\'back\')" style="color:#007AFF;border-color:rgba(0,122,255,0.2)">← Volver</button>';
  h+='<div class="slbl">Medidas corporales</div>';
  h+='<div style="background:rgba(0,122,255,0.05);border:1px solid rgba(0,122,255,0.12);border-radius:12px;padding:10px 13px;margin-bottom:12px;font-size:12px;color:#007AFF;line-height:1.6">📅 Mide al final de cada mesociclo. El % muestra evolución respecto a tu primera medida.</div>';
  if(recs.length>=2)h+=rMedChart(recs);
  h+='<div class="slbl">Resumen actual</div>';
  var lr=recs[recs.length-1];
  MEDIDAS.forEach(function(m){
    var last=lr&&lr.data[m.k];var delta=medDelta(recs,m.k);var col=medDeltaColor(delta,m.mejor);
    h+='<div class="card" style="padding:12px 14px;margin-bottom:7px"><div style="display:flex;align-items:center;gap:8px"><div style="flex:1"><div style="font-size:13px;font-weight:700">'+m.k+'</div><div style="font-size:10px;color:#999;margin-top:2px">'+m.tip+'</div></div>'+(last?'<div style="text-align:right"><div style="font-size:18px;font-weight:800">'+last+' <span style="font-size:11px;color:#999">cm</span></div>'+(delta?'<div style="font-size:11px;font-weight:700;color:'+col+'">'+(delta.diff>0?'+':'')+delta.diff+' cm ('+(delta.pct>0?'+':'')+delta.pct+'%)</div>':'<div style="font-size:11px;color:#999">Base</div>')+'</div>':'<div style="font-size:12px;color:#ccc">—</div>')+'</div></div>';
  });
  h+='<button class="btn btn-blue" onclick="openMedidas()">+ Nuevo registro</button>';
  if(recs.length){
    h+='<div class="slbl">Historial</div>';
    recs.slice().reverse().forEach(function(rec,i){
      var d=new Date(rec.date);var isBase=i===recs.length-1;
      h+='<div class="card" style="padding:12px 14px;margin-bottom:7px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div style="font-size:12px;font-weight:700">'+d.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})+'</div>'+(isBase?'<div style="font-size:10px;background:rgba(0,122,255,0.1);color:#007AFF;padding:2px 8px;border-radius:99px">BASE</div>':'')+'</div><div style="display:flex;flex-wrap:wrap;gap:6px">'+MEDIDAS_KEYS.filter(function(k){return rec.data[k];}).map(function(k){return '<div style="font-size:11px;background:rgba(0,0,0,0.04);border-radius:6px;padding:3px 8px"><span style="color:#999">'+k+'</span> <strong>'+rec.data[k]+'</strong></div>';}).join('')+'</div></div>';
    });
  }
  return h;
}
function openMedidas(){
  document.getElementById('modal-title').textContent='Nuevo registro';
  var recs=getMedRecs();var lr=recs[recs.length-1]||{data:{}};
  var html='<div style="padding:12px 16px"><div style="font-size:12px;color:#999;margin-bottom:14px">Introduce tus medidas en cm.</div>';
  MEDIDAS.forEach(function(m){
    var last=lr.data[m.k]||'';
    html+='<div style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><div style="font-size:13px;font-weight:600;flex:1">'+m.k+'</div><input type="number" id="med_'+m.k.replace(/[^a-zA-Z]/g,'_')+'" placeholder="'+(last||'cm')+'" value="'+(last||'')+'" step="0.1" style="width:80px;padding:7px 10px;border-radius:8px;border:1px solid rgba(0,0,0,0.12);font-size:13px;text-align:center;font-family:-apple-system,sans-serif"></div><div style="font-size:11px;color:#999">'+m.tip+'</div></div>';
  });
  html+='<button class="btn btn-blue" style="margin-top:6px" onclick="saveMedidas()">Guardar</button></div>';
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('modal').classList.add('show');
}
function saveMedidas(){
  var data={};
  MEDIDAS.forEach(function(m){
    var el=document.getElementById('med_'+m.k.replace(/[^a-zA-Z]/g,'_'));
    if(el&&el.value)data[m.k]=parseFloat(el.value);
  });
  if(!Object.keys(data).length){alert('Introduce al menos una medida.');return;}
  var recs=getMedRecs();
  recs.push({date:new Date().toISOString(),data:data});
  sv('medidas_records',JSON.stringify(recs));
  sv('medidas_last',JSON.stringify(recs[recs.length-1]));
  closeModal();showCel('📏','Medidas guardadas');
  ST.tab='medidas';sH(rMedidas());
}
